services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificados_app
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-certificados}
      DB_USER: ${DB_USER:-certificados}
      DB_PASSWORD: ${DB_PASSWORD:-certificados}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: certificados_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-certificados}
      MYSQL_USER: ${DB_USER:-certificados}
      MYSQL_PASSWORD: ${DB_PASSWORD:-certificados}
    volumes:
      - db_data:/var/lib/mysql
      # Se existir dump SQL, descomente a linha abaixo
      # - ./bd/sql:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
